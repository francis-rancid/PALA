name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Smoke test (carve JPEG + PNG from synthetic image)
        run: |
          python3 - <<'EOF'
          from PIL import Image
          import random, os

          os.makedirs("/tmp/pala-ci", exist_ok=True)
          img = Image.new("RGB", (64, 64), (100, 150, 200))
          img.save("/tmp/pala-ci/orig.png")
          img.save("/tmp/pala-ci/orig.jpg")

          with open("/tmp/pala-ci/orig.png", "rb") as f: png = f.read()
          with open("/tmp/pala-ci/orig.jpg", "rb") as f: jpg = f.read()
          noise = bytes([random.randint(0, 255) for _ in range(512 * 1024)])
          with open("/tmp/pala-ci/raw.img", "wb") as f:
              f.write(noise)
              f.write(png)
              f.write(b"\x00" * 256)
              f.write(jpg)
          print(f"image written: {len(noise) + len(png) + 256 + len(jpg)} bytes")
          EOF
          target/release/pala /tmp/pala-ci/raw.img /tmp/pala-ci/out/ -t jpeg,png

      - name: Verify exact SHA-256 match
        run: |
          python3 - <<'EOF'
          import hashlib, glob, sys

          def sha(p): return hashlib.sha256(open(p, "rb").read()).hexdigest()

          orig_png = sha("/tmp/pala-ci/orig.png")
          orig_jpg = sha("/tmp/pala-ci/orig.jpg")
          carv_png = sha("/tmp/pala-ci/out/png_0001.png")
          carv_jpg = sha("/tmp/pala-ci/out/jpg_0001.jpg")

          ok = True
          if orig_png != carv_png:
              print(f"PNG mismatch: {orig_png} vs {carv_png}"); ok = False
          if orig_jpg != carv_jpg:
              print(f"JPG mismatch: {orig_jpg} vs {carv_jpg}"); ok = False
          if ok:
              print("SHA-256 match: PASS")
          sys.exit(0 if ok else 1)
          EOF

      - name: Install Python test dependencies
        run: pip install Pillow

      - name: Full test suite (tests/test_pala.py)
        run: python3 tests/test_pala.py

      - name: Binary size check (must be under 2MB)
        run: |
          SIZE=$(stat -c%s target/release/pala)
          echo "pala binary: ${SIZE} bytes"
          [ "$SIZE" -lt 2097152 ] || (echo "FAIL: binary exceeds 2MB" && exit 1)
